name: lumos_ai
description: LUMOS AI — AI Operating System for Professional Photography
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # Navigation
  go_router: ^14.6.0

  # UI
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.0
  image: ^4.2.0
  photo_view: ^0.15.0
  flutter_colorpicker: ^1.1.0
  flutter_slidable: ^3.1.0

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.0
  http: ^1.2.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0

  # Utils
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  uuid: ^4.5.0
  intl: ^0.20.3
  collection: ^1.18.0
  path: ^1.9.0
  mime: ^2.0.0
  crypto: ^3.0.0
  archive: ^3.6.0

  # File picker
  file_picker: ^8.1.0

  # Desktop
  window_manager: ^0.4.0
  screen_retriever: ^0.2.0
  hotkey_manager: ^0.2.0
  tray_manager: ^0.2.0
  protocol_handler: ^0.2.0
  url_launcher: ^6.3.0

  # Dev
  flutter_lints: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.0

flutter:
  uses-material-design: true
  generate: true


