[package]
name = "lumos-render"
version = "1.0.0"
edition = "2024"
description = "GPU-accelerated rendering engine for LUMOS AI"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
rayon = "1.10"
glam = "0.29"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.9"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
wgpu = "22"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "lumos-render"
path = "src/main.rs"

[lib]
name = "lumos_render"
path = "src/lib.rs"
